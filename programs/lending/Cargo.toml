[package]
name = "nutrifi-lending"
version = "0.1.0"
description = "NutriFi lending program: nSOL collateral, mock-USDC debt, liquidation."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nutrifi_lending"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["mint", "token"] }
