[toolchain]
anchor_version = "0.31.1"
# No `solana_version` here: Anchor would run `solana-install`, which Agave
# removed (use `agave-install`). Use a Solana 1.18.x toolchain on your PATH.

[features]
resolution = true
skip-lint = false

[programs.localnet]
nutrifi_staking = "221frxT7k1xFtwd4y7iWimUxiBe97zdte61mX7NTkkt9"
nutrifi_lending = "EgYyi4Htyoe7AVDBKfFD8T2LxswDfK6BVYt7vvCXSFtK"

[programs.devnet]
nutrifi_staking = "221frxT7k1xFtwd4y7iWimUxiBe97zdte61mX7NTkkt9"
nutrifi_lending = "EgYyi4Htyoe7AVDBKfFD8T2LxswDfK6BVYt7vvCXSFtK"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.mainnet-beta.solana.com"
bind_address = "127.0.0.1"

[workspace]
members = ["programs/staking", "programs/lending"]
