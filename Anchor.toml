[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.17"

[features]
resolution = true
skip-lint = false

[programs.localnet]
nutrifi_staking = "StkNUTriFi1111111111111111111111111111111111"
nutrifi_lending = "LndNUTriFi1111111111111111111111111111111111"

[programs.devnet]
nutrifi_staking = "StkNUTriFi1111111111111111111111111111111111"
nutrifi_lending = "LndNUTriFi1111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.mainnet-beta.solana.com"

[workspace]
members = ["programs/staking", "programs/lending"]
